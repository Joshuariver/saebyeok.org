name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject passwords from secrets
        env:
          DAWN_PASSWORD: ${{ secrets.DAWN_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python3 -c "
          import os
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          html = html.replace('__DAWN_PASSWORD__', os.environ['DAWN_PASSWORD'])
          html = html.replace('__ADMIN_PASSWORD__', os.environ['ADMIN_PASSWORD'])
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
